<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div id="header">
        <h1>Library</h1>
    </div>
    <div id="body">
        <div id="bookshelf">

        </div>
    </div>
    <div id="bottom-btn">
        <button id="add-btn" command="show-modal" commandfor="bookdialog">Add Book</button>
        <dialog id="bookdialog" method="dialog">
            <h4>Add a new book</h4>
            <form id="addform" method="get">
                <label for="booktitle">Title:</label><br>
                <input type="text" id="booktitle" name="booktitle" required><br>
                <label for="bookauthor">Author:</label><br>
                <input type="text" id="bookauthor" name="bookauthor" required><br>
                <label for="bookpages">Number of pages:</label><br>
                <input type="text" id="bookpages" name="bookpages" required><br>
                <button id="submit-btn" type="submit">Submit</button>
            </form>
        </dialog>
    </div>
</body>
</html>
